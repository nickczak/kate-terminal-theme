# GitHub Dark palette with a true-black terminal background.
# Normal: #e1e4e8  muted: #6a737d  blue: #79b8ff
# Purple: #b392f0  coral: #f97583  selection: #253749

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style "bg=#000000,fg=#e1e4e8"

# Session | numbered windows | command, clock, and date.
set -g status-left-length 32
set -g status-left-style "bg=#000000,fg=#79b8ff,bold"
set -g status-left " #S #[fg=#444d56,nobold]│ "
set -g status-right-length 65
set -g status-right-style "bg=#000000,fg=#6a737d"
set -g status-right '#{?client_prefix,#[fg=#f97583 bold]PREFIX #[default],}#[fg=#6a737d]#{pane_current_command} #[fg=#444d56]│ #[fg=#e1e4e8]%H:%M #[fg=#6a737d]%a %d %b '

setw -g window-status-format " #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-style "bg=#000000,fg=#6a737d"
setw -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-style "bg=#253749,fg=#e1e4e8,bold"
setw -g window-status-last-style "fg=#79b8ff"
setw -g window-status-activity-style "fg=#b392f0"
setw -g window-status-bell-style "fg=#f97583,bold"
setw -g window-status-separator " "

# Pane surfaces and focus indicators.
setw -g window-style "bg=#000000,fg=#e1e4e8"
setw -g window-active-style "bg=#000000,fg=#e1e4e8"
set -g pane-border-style "fg=#444d56,bg=#000000"
set -g pane-active-border-style "fg=#79b8ff,bg=#000000"
set -g pane-border-lines single
set -g display-panes-colour "#6a737d"
set -g display-panes-active-colour "#79b8ff"

# Command prompts, copy-mode selections, and popup windows.
set -g message-style "bg=#000000,fg=#e1e4e8"
set -g message-command-style "bg=#000000,fg=#79b8ff"
setw -g mode-style "bg=#253749,fg=#e1e4e8"
setw -g clock-mode-colour "#79b8ff"
set -g popup-style "bg=#000000,fg=#e1e4e8"
set -g popup-border-style "bg=#000000,fg=#79b8ff"
set -g popup-border-lines rounded
